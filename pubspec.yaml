name: app_utilities
description: "Flutter App utilities Package for app components and helper functions."
version: 0.0.1
homepage:

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:

  device_info_plus: ^9.1.0
  easy_localization: ^3.0.3
  dio: ^5.3.3
  eva_icons_flutter: ^3.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.8
  get: ^4.6.6
  http: ^1.2.0
  intl: ^0.19.0
  lottie: ^2.7.0
  package_info_plus: ^4.2.0
  shared_preferences: ^2.2.2
  country_picker: ^2.0.22
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # This package is for lints warnings and errors and coding best practices
  flutter_lints: ^2.0.0


flutter:

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/map/
    - assets/translations/

  fonts:
    - family: EuclidCircular
      fonts:
        - asset: assets/fonts/EuclidCircularABold.ttf
          weight: 700
        - asset: assets/fonts/EuclidCircularABoldItalic.ttf
          weight: 700
        - asset: assets/fonts/EuclidCircularAItalic.ttf
          weight: 500
        - asset: assets/fonts/EuclidCircularALightItalic.ttf
          weight: 400
        - asset: assets/fonts/EuclidCircularAMedium.ttf
          weight: 500
        - asset: assets/fonts/EuclidCircularAMediumItalic.ttf
          weight: 500
        - asset: assets/fonts/EuclidCircularARegular.ttf
          weight: 500
        - asset: assets/fonts/EuclidCircularASemiBold.ttf
          weight: 600
        - asset: assets/fonts/EuclidCircularASemiBoldItalic.ttf
          weight: 600

    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlabBold.ttf
          weight: 700
        - asset: assets/fonts/RobotoSlabRegular.ttf
          weight: 500
        - asset: assets/fonts/RobotoSlabMedium.ttf
          weight: 600
        - asset: assets/fonts/RobotoSlabSemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoSlabLight.ttf
          weight: 400

    - family: SourceSansPro
      fonts:
        - asset: assets/fonts/SourceSansProBold.ttf
          weight: 700
        - asset: assets/fonts/SourceSansProRegular.ttf
          weight: 500
        - asset: assets/fonts/SourceSansProLight.ttf
          weight: 400

